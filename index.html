<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSF × XD Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--bd:#e3e6eb;--ac:#2563eb;--ex:#b45309;--red:#f8c9c9;--yel:#fde7b8;--ok:#15803d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151a;--card:#1b1f27;--tx:#e8eaee;--mu:#9aa3b2;--bd:#2c323d;--ac:#6ea0ff;--ex:#fbbf24;--red:#5a2a2e;--yel:#5a4a22;--ok:#4ade80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151a;--card:#1b1f27;--tx:#e8eaee;--mu:#9aa3b2;--bd:#2c323d;--ac:#6ea0ff;--ex:#fbbf24;--red:#5a2a2e;--yel:#5a4a22;--ok:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}h2{font-size:16px;margin:0 0 4px}
.sub{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:28px;line-height:1.2}.kpi span{color:var(--mu);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
input[type=text],textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font:inherit}
textarea{width:100%;min-height:100px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
label.ck{display:flex;align-items:center;gap:6px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.scroll{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:left}
th{color:var(--mu);font-weight:600;font-size:12px}
.n{text-align:right;font-variant-numeric:tabular-nums}
tr.red td{background:var(--red)}tr.yel td{background:var(--yel)}tr.past td{color:var(--mu)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--ok);color:var(--ok)}
.tag.ex{border-color:var(--ex);color:var(--ex)}
.empty{color:var(--mu);padding:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<main>
<h1>SSF × XD Dashboard</h1>
<div class="sub" id="status"></div>
<div class="kpis" id="kpis"></div>

<div class="card">
  <div class="filters">
    <input type="text" id="q" placeholder="ค้นหาหุ้น เช่น BCH">
    <label class="ck"><input type="checkbox" id="onlySsf"> เฉพาะหุ้นที่มี SSF</label>
  </div>
</div>

<div class="cols">
  <div class="card">
    <h2>ใกล้ XD: ภายใน 7 วัน</h2>
    <div class="sub">แดง = ภายใน 1 วัน · เหลือง = ภายใน 3 วัน</div>
    <div class="scroll" id="tNear"></div>
  </div>
  <div class="card">
    <h2>ประกาศ XD ทั้งหมด</h2>
    <div class="sub">ประกาศล่าสุดก่อน · เหลือง = อยู่ในช่วง 7 วัน · เทา = ขึ้น XD ไปแล้ว</div>
    <div class="scroll" id="tAll"></div>
  </div>
</div>

<div class="sub" style="margin-top:14px">ข้อมูลจาก SET Open API · แก้รายชื่อหุ้น SSF ได้ที่ไฟล์ ssf_list.txt ใน GitHub</div>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var DAY=86400000,NEAR=7;
function pad(n){return String(n).padStart(2,"0")}
function fmt(d){return d?pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear():"–"}
function parseD(s){
  var m=String(s||"").trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);
  if(!m)return null;var y=+m[3];if(y>2400)y-=543;
  var d=new Date(y,+m[2]-1,+m[1]);return isNaN(d)?null:d;
}
function num(v){if(v===""||v==null)return null;var x=parseFloat(String(v).replace(/,/g,""));return isNaN(x)?null:x}
function today(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function f2(v){return v==null?"–":v.toFixed(2)}

var DATA=[],SSF={},META={};
function build(){
  var t=today().getTime(),m={};
  DATA.forEach(function(r){
    var k=r.stock+"|"+r.xd.getTime();
    var g=m[k]||(m[k]={stock:r.stock,xd:r.xd,date:r.date,div:null,ex:null,ssf:false});
    if(r.div!=null)g.div=(g.div||0)+r.div;
    if(r.ex!=null)g.ex=(g.ex||0)+r.ex;
    if(r.flag||SSF[r.stock])g.ssf=true;
  });
  return Object.keys(m).map(function(k){var g=m[k];g.days=Math.round((g.xd.getTime()-t)/DAY);return g});
}
function cls(r,near){
  if(near)return r.days<=1?"red":r.days<=3?"yel":"";
  return r.days<0?"past":r.days<=NEAR?"yel":"";
}
function table(rows,near,empty){
  if(!rows.length)return '<div class="empty">'+empty+"</div>";
  var head=near?["STOCK","xd","ปันผล","Extra","SSF","เหลือ (วัน)"]:["ประกาศ","STOCK","xd","ปันผล","Extra","SSF","เหลือ (วัน)"];
  return "<table><thead><tr>"+head.map(function(h,i){return "<th"+(h=="ปันผล"||h=="Extra"||h=="เหลือ (วัน)"?' class="n"':"")+">"+h+"</th>"}).join("")+"</tr></thead><tbody>"+
  rows.map(function(r){
    var c=[];
    if(!near)c.push("<td>"+fmt(r.date)+"</td>");
    c.push("<td><b>"+esc(r.stock)+"</b></td>","<td>"+fmt(r.xd)+"</td>",'<td class="n">'+f2(r.div)+"</td>",
      '<td class="n">'+(r.ex!=null?'<span class="tag ex">'+f2(r.ex)+"</span>":"–")+"</td>",
      "<td>"+(r.ssf?'<span class="tag">SSF</span>':"")+"</td>",'<td class="n">'+r.days+"</td>");
    return '<tr class="'+cls(r,near)+'">'+c.join("")+"</tr>";
  }).join("")+"</tbody></table>";
}
function render(){
  var all=build();
  $("status").textContent="ข้อมูล SET ณ "+(META.asOf||"-")+" · อัปเดตเว็บล่าสุด "+(META.generatedAt||"-")+" · "+all.length+" รายการ"+(Object.keys(SSF).length?"":" · (ยังไม่ได้ใส่ ssf_list.txt)");
  var st={},sf={},ex={},nr=0;
  all.forEach(function(r){st[r.stock]=1;if(r.ssf)sf[r.stock]=1;if(r.ex!=null)ex[r.stock]=1;if(r.days>=0&&r.days<=NEAR)nr++});
  $("kpis").innerHTML=[["หุ้นที่ประกาศ XD ทั้งหมด",Object.keys(st).length],["ในนั้นมี SSF",Object.keys(sf).length],
    ["มี EXTRA DIVIDEND",Object.keys(ex).length],["ขึ้น XD ภายใน "+NEAR+" วัน",nr]]
    .map(function(k){return '<div class="kpi"><b>'+k[1]+"</b><span>"+k[0]+"</span></div>"}).join("");
  var q=$("q").value.trim().toUpperCase(),os=$("onlySsf").checked;
  var f=all.filter(function(r){return(!q||r.stock.indexOf(q)>=0)&&(!os||r.ssf)});
  var near=f.filter(function(r){return r.days>=0&&r.days<=NEAR}).sort(function(a,b){return a.xd-b.xd||a.stock.localeCompare(b.stock)});
  var list=f.slice().sort(function(a,b){return(b.date?b.date.getTime():0)-(a.date?a.date.getTime():0)||a.xd-b.xd||a.stock.localeCompare(b.stock)});
  $("tNear").innerHTML=table(near,true,"ไม่มีหุ้นขึ้น XD ในช่วง "+NEAR+" วันข้างหน้า");
  $("tAll").innerHTML=table(list,false,"ยังไม่มีข้อมูล");
}
["q","onlySsf"].forEach(function(i){$(i).addEventListener("input",render)});
function load(){
  fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(j){
    META=j;SSF={};(j.ssf||[]).forEach(function(s){SSF[s]=1});
    DATA=(j.rows||[]).map(function(r){return{date:parseD(r[0]),stock:r[1],xd:parseD(r[2]),div:num(r[3]),ex:num(r[4]),flag:false}}).filter(function(r){return r.xd});
    render();
  }).catch(function(e){$("status").textContent="โหลดข้อมูลไม่ได้: "+e.message});
}
load();setInterval(load,60000);  // เปิดหน้าค้างไว้ก็ดึงข้อมูลใหม่ทุก 1 นาที
})();
</script>
</body>
</html>
