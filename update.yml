name: update-dashboard

on:
  schedule:
    - cron: "*/15 * * * *"   # ทุก 15 นาที (GitHub อาจหน่วงได้ ไม่ตรงเป๊ะ)
  workflow_dispatch:          # ปุ่มรันเองจากแท็บ Actions
  push:
    branches: [main]
    paths: ["ssf_list.txt", "template/**", "build_site.py", "fetch_ca.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Build site from SET API
        env:
          SET_API_KEY: ${{ secrets.SET_API_KEY }}
        run: python build_site.py
      - name: Commit history if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/set_ca.csv
          git diff --cached --quiet || (git commit -m "update data [skip ci]" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
